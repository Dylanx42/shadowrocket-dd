rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - DOMAIN,captive.apple.com,DIRECT
  - DOMAIN,connectivitycheck.gstatic.com,DIRECT
  - DOMAIN,msftconnecttest.com,DIRECT
  - DOMAIN,msftncsi.com,DIRECT
  - RULE-SET,private-domain,DIRECT
  - RULE-SET,custom-reject,🛡 广告拦截
  - RULE-SET,custom-direct,DIRECT
  - RULE-SET,custom-ai,🤖 AI服务
  - RULE-SET,custom-proxy,🚀 主节点
  - RULE-SET,ads-domain,🛡 广告拦截
  - DOMAIN,accounts.google.com,🤖 AI服务
  - DOMAIN,myaccount.google.com,🤖 AI服务
  - DOMAIN,oauth2.googleapis.com,🤖 AI服务
  - DOMAIN-SUFFIX,googleapis.com,🤖 AI服务
  - DOMAIN-SUFFIX,x.ai,🤖 AI服务
  - DOMAIN-SUFFIX,grok.com,🤖 AI服务
  - RULE-SET,ai-domain,🤖 AI服务
  - RULE-SET,github-domain,🐱 开发服务
  - RULE-SET,gitlab-domain,🐱 开发服务
  - RULE-SET,atlassian-domain,🐱 开发服务
  - RULE-SET,youtube-domain,🎬 流媒体
  - RULE-SET,netflix-domain,🎬 流媒体
  - RULE-SET,disney-domain,🎬 流媒体
  - RULE-SET,hbo-domain,🎬 流媒体
  - RULE-SET,spotify-domain,🎬 流媒体
  - RULE-SET,telegram-domain,📲 Telegram
  - RULE-SET,telegram-ip,📲 Telegram,no-resolve
  - RULE-SET,twitter-domain,🌐 社交网络
  - RULE-SET,facebook-domain,🌐 社交网络
  - RULE-SET,tiktok-domain,🌐 社交网络
