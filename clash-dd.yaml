# DD Clash / Mihomo Configuration
# Version: 0.1.0
# Updated: 2026-09-09
#
# Design goals:
# - Mirror the current DD Shadowrocket v0.3.0 routing model
# - Dual-provider aggregation: 白月光 + BoostNet
# - Region-based automatic latency selection
# - Stable manually selected US exit for AI services
# - Independent routing for development / Google / streaming / social services
# - Switchable ad blocking
# - MRS rule providers where possible for lower iOS memory usage
# - No subscription URLs or credentials are committed to this public repository
#
# IMPORTANT:
# 1) Import this profile from the Raw URL.
# 2) Edit proxy-providers below and paste your private 白月光 / BoostNet URLs.
# 3) Keep those subscription URLs private. They are effectively account credentials.

mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "localhost"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "msftconnecttest.com"
    - "msftncsi.com"

proxy-providers:
  baiyueguang:
    type: http
    url: "https://example.com/replace-with-private-baiyueguang-subscription"
    path: ./providers/baiyueguang.yaml
    interval: 21600
    exclude-filter: "(?i)(流量|剩余|套餐|到期|官网|Traffic|Expire|Remaining|Expire Date)"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      lazy: true
    override:
      additional-prefix: "[白月光] "

  boostnet:
    type: http
    url: "https://example.com/replace-with-private-boostnet-subscription"
    path: ./providers/boostnet.yaml
    interval: 21600
    exclude-filter: "(?i)(流量|剩余|套餐|到期|官网|Traffic|Expire|Remaining|Expire Date)"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      lazy: true
    override:
      additional-prefix: "[BoostNet] "

proxy-groups:
  - name: "☁️ 白月光优选"
    type: url-test
    use: [baiyueguang]
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "🅱️ BoostNet优选"
    type: url-test
    use: [boostnet]
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "⚡ 双机场自动"
    type: url-test
    use: [baiyueguang, boostnet]
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "🛟 双机场容灾"
    type: fallback
    proxies: ["☁️ 白月光优选", "🅱️ BoostNet优选"]
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

  - name: "🇭🇰 香港自动"
    type: url-test
    use: [baiyueguang, boostnet]
    filter: "(?i)(🇭🇰|HK|Hong ?Kong|香港|深港|沪港|京港)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "🇯🇵 日本自动"
    type: url-test
    use: [baiyueguang, boostnet]
    filter: "(?i)(🇯🇵|JP|Japan|Tokyo|Osaka|日本|东京|東京|大阪)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "🇸🇬 新加坡自动"
    type: url-test
    use: [baiyueguang, boostnet]
    filter: "(?i)(🇸🇬|SG|Singapore|Sing|新加坡|狮城)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "🇺🇸 美国自动"
    type: url-test
    use: [baiyueguang, boostnet]
    filter: "(?i)(🇺🇸|US|USA|United ?States|America|美国|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|芝加哥|凤凰城|鳳凰城)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "🇹🇼 台湾自动"
    type: url-test
    use: [baiyueguang, boostnet]
    filter: "(?i)(🇹🇼|TW|TWN|Taiwan|Taipei|台湾|台灣|台北|台中|新北)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: "🚀 主节点"
    type: select
    proxies: ["⚡ 双机场自动", "🛟 双机场容灾", "☁️ 白月光优选", "🅱️ BoostNet优选", "🇭🇰 香港自动", "🇯🇵 日本自动", "🇸🇬 新加坡自动", "🇺🇸 美国自动", "🇹🇼 台湾自动", DIRECT]

  - name: "🤖 AI固定美国节点"
    type: select
    use: [baiyueguang, boostnet]
    filter: "(?i)(🇺🇸|US|USA|United ?States|America|美国|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|芝加哥|凤凰城|鳳凰城)"

  - name: "🤖 AI服务"
    type: select
    proxies: ["🤖 AI固定美国节点", "🇺🇸 美国自动", "🚀 主节点", DIRECT]

  - name: "🐱 开发服务"
    type: select
    proxies: ["🚀 主节点", "🇯🇵 日本自动", "🇭🇰 香港自动", "🇸🇬 新加坡自动", "🇺🇸 美国自动", DIRECT]

  - name: "🔍 Google"
    type: select
    proxies: ["🚀 主节点", "🤖 AI固定美国节点", "🇺🇸 美国自动", "🇯🇵 日本自动", "🇸🇬 新加坡自动", "🇭🇰 香港自动", DIRECT]

  - name: "🎬 流媒体"
    type: select
    proxies: ["🚀 主节点", "🇺🇸 美国自动", "🇯🇵 日本自动", "🇸🇬 新加坡自动", "🇭🇰 香港自动", "🇹🇼 台湾自动", DIRECT]

  - name: "📲 Telegram"
    type: select
    proxies: ["🚀 主节点", "🇸🇬 新加坡自动", "🇯🇵 日本自动", "🇺🇸 美国自动", "🇭🇰 香港自动", DIRECT]

  - name: "🌐 社交网络"
    type: select
    proxies: ["🚀 主节点", "🇺🇸 美国自动", "🇯🇵 日本自动", "🇸🇬 新加坡自动", "🇭🇰 香港自动", DIRECT]

  - name: "🍎 Apple"
    type: select
    proxies: [DIRECT, "🚀 主节点", "🇭🇰 香港自动", "🇯🇵 日本自动", "🇺🇸 美国自动"]

  - name: "🪟 Microsoft"
    type: select
    proxies: [DIRECT, "🚀 主节点", "🇯🇵 日本自动", "🇺🇸 美国自动"]

  - name: "🛡 广告拦截"
    type: select
    proxies: [REJECT, DIRECT]

  - name: "🔒 国内网络"
    type: select
    proxies: [DIRECT, "🚀 主节点"]

  - name: "🐟 漏网之鱼"
    type: select
    proxies: ["🚀 主节点", DIRECT]

